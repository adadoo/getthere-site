# GitHub Pages serves the gh-pages branch. Every push to main copies main there.
name: Publish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Policies point at terms/<channel>/<version>.html, so a published version is never
      # changed or removed. New versions are added as new files.
      - name: Published terms never change
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-status "$BEFORE" HEAD -- 'terms/*/*.html' | grep -v '^A' || true)
            if [ -n "$changed" ]; then echo "Published terms changed:"; echo "$changed"; exit 1; fi
          fi
      - run: git push --force origin HEAD:gh-pages
